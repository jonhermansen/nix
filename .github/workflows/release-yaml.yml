name: Release YAML Nix

# Build this YAML-fork of Nix (the fromYAML/toYAML builtins) as installable binary
# tarballs for the three platforms we deploy on, run the test suite, and publish them
# to a GitHub release. Downstream repos pin the resulting tarballs by URL + sha256.
#
# Separate from ci.yml and the upstream upload-release.yml (which needs Hydra + NixOS's
# AWS/S3). This one is self-contained: only GITHUB_TOKEN, only this repo's release.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. 2.35.4-yaml.1)"
        required: true
        default: "2.35.4-yaml.1"
  push:
    tags:
      - "*-yaml.*"

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-26.04
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
      - id: tag
        run: echo "tag=${{ github.event.inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"
      - name: Create the release (as a draft) if it does not exist
        env:
          GH_TOKEN: ${{ github.token }}
        # Draft, so immutable-release protection (now the default on new
        # releases) doesn't lock the asset endpoints before per-platform
        # uploads land. The finalize job publishes the draft at the end.
        run: |
          tag="${{ steps.tag.outputs.tag }}"
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$tag" --repo "$GITHUB_REPOSITORY" \
                 --draft \
                 --title "$tag" \
                 --notes "YAML-fork of Nix (fromYAML/toYAML builtins) — $tag" \
                 --target "$GITHUB_SHA"

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - runs-on: ubuntu-26.04
            os: linux
          - runs-on: ubuntu-26.04-arm
            os: linux
          - runs-on: [self-hosted, macOS, ARM64]
            os: darwin
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/install-nix-action
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          dogfood: false # bootstrap with stable upstream nix
          extra_nix_config: "sandbox = true"
      - name: Allow unprivileged user namespaces (Linux)
        if: matrix.os == 'linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      # Tests must pass on the rebased tree — C++ component tests plus the flake checks,
      # which include the fromYAML/toYAML round-trip and helm-roundtrip functional tests.
      # (NixOS vmTests are skipped here: heavy and need nested virt the free runners lack.)
      - name: Component tests
        run: nix build --file ci/gha/tests/wrapper.nix componentTests -L
      - name: Flake checks
        run: ci/gha/tests/build-checks
      - name: Build installable binary tarball
        run: |
          system=$(nix eval --raw --impure --expr builtins.currentSystem)
          nix build -L ".#hydraJobs.binaryTarball.$system" --out-link result-tarball
          mkdir -p dist
          cp result-tarball/*.tar.xz dist/
      - name: Checksums
        run: |
          cd dist
          for f in *.tar.xz; do
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "$f" > "$f.sha256"
            else
              shasum -a 256 "$f" > "$f.sha256"
            fi
          done
          cat ./*.sha256
      - name: Upload tarball to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ needs.create-release.outputs.tag }}" dist/* \
            --repo "$GITHUB_REPOSITORY" --clobber
      # Nix's own installer (install.in), per-system, with this build's tarball hash
      # baked in and --tarball-url-prefix support. Downstream curls install-$system and
      # runs it against this release, so the sha256 lives only here, never copied around.
      - name: Upload installer to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          system=$(nix eval --raw --impure --expr builtins.currentSystem)
          nix build -L ".#hydraJobs.installerScriptForGHA.$system" --out-link result-installer
          # Asset name is the file's basename, so rename per-system (otherwise all three
          # legs upload "install" and --clobber collapses them to one).
          cp result-installer/install "install-$system"
          gh release upload "${{ needs.create-release.outputs.tag }}" "install-$system" \
            --repo "$GITHUB_REPOSITORY" --clobber

  # Flip the draft to a published release only after every build leg landed its
  # assets. Immutability (if enabled on the repo/org) takes effect at publish time.
  finalize:
    needs: [create-release, build]
    runs-on: ubuntu-26.04
    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit "${{ needs.create-release.outputs.tag }}" \
            --repo "$GITHUB_REPOSITORY" --draft=false
